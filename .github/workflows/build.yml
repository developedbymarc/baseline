# Builds the whole project (backend + frontend + config), then starts the container
# and checks that both servers answer.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: false
          load: true
          tags: baseline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: docker run -d --name baseline -p 3000:3000 -p 5074:5074 baseline:ci

      - name: Check that both servers answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5074/api/config/metrics > /dev/null \
               && curl -fsS http://localhost:3000/ > /dev/null; then
              echo "Backend and frontend are up."
              exit 0
            fi
            sleep 2
          done
          echo "Servers did not start in time."
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs baseline || true
