# BASELINE: config/metrics.yaml  (work package 2.1, owner: Serge)
# v1.2. All data in the app is SYNTHETIC. BASELINE is decision support, not diagnosis.
#
# Status rules (decided; A's status engine 4.2 reads this):
#   A value exactly ON a limit counts as INSIDE that band.
#   green  = warn_low <= value <= warn_high
#   yellow = beyond a warn limit but not beyond the crit limit (crit_low <= value < warn_low, or warn_high < value <= crit_high)
#   red    = value < crit_low or value > crit_high
#   final status = worse of (absolute limits, personal z-score)
#   normal_low/normal_high = shaded healthy band on trend charts only
#   null   = no limit on that side; the engine skips it
#   plausible_min/max = typo check only (story C3), deliberately wide
#   sd_pop = population SD used for the shrunk baseline SD when n < 10 (spec section 8). null = no cited value yet, so the person's own SD is used.
#   A red reading raises an alert at once (no automatic retake step; see docs/API.md).
#   sd_pop for BP is NOT yet confirmed against NHANES itself (see its source note); no demo baseline uses it (n = 14).
#
# Every metric has a sources list. Each entry names the fields it covers as a LIST.
# publisher: team = our own starting value, no external source yet (needs review before real use).

version: "1.2"

metrics:
  - code: hr_rest
    name: Resting heart rate
    unit: bpm
    plausible_min: 25
    plausible_max: 220
    normal_low: 60
    normal_high: 100
    warn_low: 50             # below 60 is only a flag if NOT a trained athlete (Mayo); 50 is our margin
    warn_high: 100           # 100 is green; above 100 at rest is tachycardia
    crit_low: 40             # Mayo: very fit athletes may be near 40
    crit_high: 120
    z_warn: 1.5
    z_crit: 2.5
    sd_pop: null             # no cited value yet
    polarity: both
    instructions_md: howto/hr_rest.md
    sources:
      - fields: [normal_low, normal_high, warn_high, crit_low]
        publisher: Mayo Clinic
        title: "Heart rate: What's normal?"
        url: https://www.mayoclinic.org/heart-rate/expert-answers/faq-20057979
        note: Adult resting 60-100 bpm; very fit athletes closer to 40; see a professional if regularly above 100 or, for non-athletes, often below 60.
        checked: 2026-11-14
        opened: true
      - fields: [plausible_min, plausible_max, warn_low, crit_high, z_warn, z_crit, sd_pop]
        publisher: team
        title: Team starting values
        note: z limits are the spec section 8 starting values. No external source yet.

  - code: bp_sys
    name: Systolic blood pressure
    unit: mmHg
    plausible_min: 50
    plausible_max: 260
    normal_low: 90
    normal_high: 120
    warn_low: 90             # 90 is green; below 90 is generally "low" (Mayo)
    warn_high: 129           # AHA stage 1 starts at 130, so 130 is yellow
    crit_low: 80
    crit_high: 139           # AHA stage 2 starts at 140, so 140 is red
    z_warn: 1.5
    z_crit: 2.5
    sd_pop: 19.34            # NHANES 2017-2020 adults, via cardioStatsUSA nhanes_data (see sources)
    polarity: both
    instructions_md: howto/bp.md
    sources:
      - fields: [normal_high, warn_high, crit_high]
        publisher: American Heart Association
        title: Understanding Blood Pressure Readings
        url: https://heart.org/bplevels
        note: Normal below 120; stage 1 130-139; stage 2 140 or higher; crisis above 180 (and/or 120 diastolic).
        checked: 2026-11-14
        opened: true
      - fields: [normal_low, warn_low]
        publisher: Mayo Clinic
        title: Low blood pressure (hypotension)
        url: https://www.mayoclinic.org/diseases-conditions/low-blood-pressure/symptoms-causes/syc-20355465
        note: In general, low is below 90/60 mm Hg; symptoms matter more than the number.
        checked: 2026-11-14
        opened: true
      - fields: [sd_pop]
        publisher: cardioStatsUSA (JHS-HWG) documentation of NHANES data
        title: nhanes_data reference
        url: https://jhs-hwg.github.io/cardioStatsUSA/reference/nhanes_data.html
        note: Mean systolic BP 124.06 mmHg, SD 19.34, n=56,017 (NHANES-derived, adults of all ages). Between-person SD, wider than one person's day-to-day SD. Seen in a search result; confirm against the NHANES source.
        checked: 2026-11-14
        opened: false
      - fields: [plausible_min, plausible_max, crit_low, z_warn, z_crit]
        publisher: team
        title: Team starting values
        note: No external source yet.

  - code: bp_dia
    name: Diastolic blood pressure
    unit: mmHg
    plausible_min: 30
    plausible_max: 150
    normal_low: 60
    normal_high: 80
    warn_low: 60             # 60 is green; below 60 is generally "low" (Mayo)
    warn_high: 79            # AHA stage 1 starts at 80, so 80 is yellow
    crit_low: 50
    crit_high: 89            # AHA stage 2 starts at 90, so 90 is red
    z_warn: 1.5
    z_crit: 2.5
    sd_pop: 12.10            # NHANES 2017-2020 adults, via cardioStatsUSA nhanes_data (see sources)
    polarity: both
    instructions_md: howto/bp.md
    sources:
      - fields: [normal_high, warn_high, crit_high]
        publisher: American Heart Association
        title: Understanding Blood Pressure Readings
        url: https://heart.org/bplevels
        note: Normal below 80; stage 1 80-89; stage 2 90 or higher; crisis above 120.
        checked: 2026-11-14
        opened: true
      - fields: [normal_low, warn_low]
        publisher: Mayo Clinic
        title: Low blood pressure (hypotension)
        url: https://www.mayoclinic.org/diseases-conditions/low-blood-pressure/symptoms-causes/syc-20355465
        note: In general, low is below 90/60 mm Hg.
        checked: 2026-11-14
        opened: true
      - fields: [sd_pop]
        publisher: cardioStatsUSA (JHS-HWG) documentation of NHANES data
        title: nhanes_data reference
        url: https://jhs-hwg.github.io/cardioStatsUSA/reference/nhanes_data.html
        note: Mean diastolic BP 70.34 mmHg, SD 12.10, n=56,017 (NHANES-derived, adults of all ages). Between-person SD. Seen in a search result; confirm against the NHANES source.
        checked: 2026-11-14
        opened: false
      - fields: [plausible_min, plausible_max, crit_low, z_warn, z_crit]
        publisher: team
        title: Team starting values
        note: No external source yet.

  - code: temp
    name: Body temperature
    unit: "°C"
    plausible_min: 30
    plausible_max: 43
    normal_low: 36.1
    normal_high: 37.2
    warn_low: 36.1           # 36.1 is green
    warn_high: 37.5          # 37.5 is green; MedlinePlus: adult probably has a fever above 37.2-37.5
    crit_low: 35.0           # 35.0 is yellow; red below 35.0 (hypothermia)
    crit_high: 38.0          # 38.0 is yellow; red above 38.0 ("over 38 °C (100.4 °F)" is fever)
    z_warn: 1.5
    z_crit: 2.5
    sd_pop: null             # no cited value yet
    polarity: both
    instructions_md: howto/temp.md
    sources:
      - fields: [normal_low, normal_high, warn_low, crit_high]
        publisher: MedlinePlus (U.S. National Library of Medicine)
        title: Body temperature norms
        url: https://medlineplus.gov/ency/article/001982.htm
        note: Normal 36.1-37.2 °C (97-99 °F); over 38 °C (100.4 °F) most often means fever. Page text confirmed 2026-11-15 (source trace 8.3).
        checked: 2026-11-15
        opened: false
      - fields: [warn_high]
        publisher: MedlinePlus (U.S. National Library of Medicine)
        title: Fever
        url: https://www.nlm.nih.gov/medlineplus/ency/article/003090.htm
        note: An adult probably has a fever when the oral temperature is above 37.2-37.5 °C (99-99.5 °F), depending on the time of day. Page text confirmed 2026-11-15 (source trace 8.3).
        checked: 2026-11-15
        opened: false
      - fields: [crit_low]
        publisher: Cedars-Sinai
        title: Hypothermia
        url: https://www.cedars-sinai.org/health-topics/hypothermia
        note: Hypothermia is below 35 °C (95 °F), a medical emergency.
        checked: 2026-11-14
        opened: true
      - fields: [plausible_min, plausible_max, z_warn, z_crit, sd_pop]
        publisher: team
        title: Team starting values
        note: No external source yet.

  - code: spo2
    name: Blood oxygen saturation
    unit: "%"
    plausible_min: 50
    plausible_max: 100
    normal_low: 95
    normal_high: 100
    warn_low: 95             # 95 is green
    warn_high: null
    crit_low: 93             # 93 is yellow; 92 or lower is red (MedlinePlus: contact a provider at 92% or lower)
    crit_high: null
    z_warn: 1.5
    z_crit: 2.5
    sd_pop: null             # no cited value yet
    polarity: low
    instructions_md: howto/spo2.md
    sources:
      - fields: [normal_low, normal_high, warn_low, crit_low]
        publisher: MedlinePlus (U.S. National Library of Medicine)
        title: "Pulse Oximetry: MedlinePlus Medical Test"
        url: https://medlineplus.gov/lab-tests/pulse-oximetry/
        note: Normal 95-100%; contact provider at 92% or lower; seek immediate attention at 88% or lower (use this in the alert text); results 2-4% off.
        checked: 2026-11-14
        opened: true
      - fields: [plausible_min, plausible_max, z_warn, z_crit, sd_pop]
        publisher: team
        title: Team starting values
        note: No external source yet.

  - code: sleep_h
    name: Sleep duration
    unit: h
    plausible_min: 0
    plausible_max: 16
    normal_low: 7
    normal_high: 9
    warn_low: 7              # 7 is green ("7 or more hours")
    warn_high: null
    crit_low: 5              # 5 is yellow; red below 5
    crit_high: null
    z_warn: 1.5
    z_crit: 2.5
    sd_pop: null             # no cited value yet
    polarity: low
    instructions_md: howto/sleep.md
    sources:
      - fields: [normal_low, normal_high, warn_low]
        publisher: CDC
        title: About Sleep
        url: https://www.cdc.gov/sleep/about/index.html
        note: Adults 18-60 "7 or more hours"; 61-64 "7-9 hours"; 65+ "7-8 hours". Updated 2024-05-15.
        checked: 2026-11-14
        opened: true
      - fields: [plausible_min, plausible_max, crit_low, z_warn, z_crit, sd_pop]
        publisher: team
        title: Team starting values
        note: No external source yet.

  # Context inputs: no status limits. Needed by context rules missed_exercise and high_stress
  # and the planted sleep/mood anomaly. Self-reported, so not health thresholds.
  - code: mood
    name: Mood (self-rating)
    unit: "1-5"
    plausible_min: 1
    plausible_max: 5
    normal_low: null
    normal_high: null
    warn_low: null
    warn_high: null
    crit_low: null
    crit_high: null
    z_warn: null
    z_crit: null
    sd_pop: null
    polarity: none
    instructions_md: howto/mood.md
    sources:
      - fields: [plausible_min, plausible_max]
        publisher: team
        title: Team starting values
        note: Self-rating scale of our own design.

  - code: exercise_min
    name: Exercise (minutes)
    unit: min
    plausible_min: 0
    plausible_max: 600
    normal_low: null
    normal_high: null
    warn_low: null
    warn_high: null
    crit_low: null
    crit_high: null
    z_warn: null
    z_crit: null
    sd_pop: null
    polarity: none
    instructions_md: howto/exercise.md
    sources:
      - fields: [plausible_min, plausible_max]
        publisher: team
        title: Team starting values
        note: Typo-check range of our own choice.